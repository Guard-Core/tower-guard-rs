site_name: tower-guard-rs
site_description: Application-layer security middleware for tower services, powered by the guard-core-rs detection engine
site_author: Renn F
repo_url: https://github.com/Guard-Core/tower-guard-rs
repo_name: Guard-Core/tower-guard-rs

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
  features:
    - content.code.copy
    - navigation.sections

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables

nav:
  - Home: index.md
  - Installation: installation.md
  - API: api.md
  - Examples: examples.md
