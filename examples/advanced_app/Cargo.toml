[package]
name = "tower-guard-advanced-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Production-shaped tower-guard-rs example service."

[dependencies]
bytes = "1.10"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["http1", "server", "server-auto", "service", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", default-features = false }
tower-guard-rs = { path = "../..", version = "1.2.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all                = { level = "deny", priority = -1 }
pedantic           = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
